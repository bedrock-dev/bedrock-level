<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bedrock NBT Text Viewer</title>
  <style>pre { white-space: pre-wrap; overflow-wrap: anywhere; }</style>
</head>
<body>
  <h1>NBT Text Viewer</h1>
  <p>Select an uncompressed Bedrock little-endian NBT file or level.dat. Files are parsed locally in your browser.</p>
  <label>Select file: <input id="file" type="file" accept=".nbt,.dat,.mcstructure"></label>
  <p id="status" role="status">Select a file.</p>
  <pre id="result" aria-label="NBT text output"></pre>
  <script src="viewer.js"></script>
</body>
</html>
